# CI for Godot Open MCP.
#
# - bootstrap: required repo paths present.
# - version-sync: generated version targets match version.json.
# - runtime-boundary: fast static guard — no editor-only Godot API leaks into Runtime/.
# - skill-audit: drift + safety audit for skills/godot-open-mcp/SKILL.md and
#   skills/client-paths.json (line budget, tool references, manifest cross-field
#   rules, forbidden content).
# - tool-docs-parity: drift audit for docs/api/mcp-tools.md against ALL_TOOLS +
#   route-policy.ts + tool-groups.ts (set / route / group / required / enum /
#   public-surface hygiene).
# - manual-setup-parity: drift audit for docs/manual-setup.md against the CLI
#   agent registry (required Cursor/Claude snippets match the canonical
#   stdio envelope, absolute GODOT_PROJECT_PATH, no HTTP/token keys, no
#   internal/forbidden content leaks).
# - mcp-server: typecheck + unit tests for the stdio MCP server package.

name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  bootstrap:
    name: Repo bootstrap check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required paths exist
        run: |
          set -e
          for path in \
            mcp-server \
            packages/bridge \
            packages/verify \
            cli \
            skills \
            demo \
            scripts \
            docs \
            docs/api \
            version.json \
            scripts/sync-version.mjs \
            README.md \
            docs/architecture.md \
            docs/api.md \
            docs/manual-setup.md \
            AGENTS.md; do
            test -e "$path" || { echo "Missing required path: $path"; exit 1; }
          done
          echo "All required bootstrap paths present."

  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify trio targets match version.json
        run: node scripts/sync-version.mjs --check

  runtime-boundary:
    name: Runtime/Editor boundary guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify no editor-only API leaks into packages/bridge/Runtime/
        # Fast static guard (milliseconds, no .NET build). Fails the PR if any
        # Runtime/**/*.cs references EditorInterface / EditorPlugin /
        # EditorFileSystem / EditorScript in real code outside a #if TOOLS guard.
        # See scripts/check-runtime-boundary.py for the rule set and suppression path.
        run: python scripts/check-runtime-boundary.py --verbose

  mcp-server:
    name: mcp-server typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        working-directory: mcp-server
        run: npm ci

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Test
        working-directory: mcp-server
        run: npm test

  skill-audit:
    name: Agent skill + client-paths audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify skill + manifest pass audit
        # No dependencies — pure node:fs. Validates that every tool name
        # referenced in skills/godot-open-mcp/SKILL.md is in the registry, the
        # skill is within the 130–180 line budget, the client-paths manifest
        # matches the CLI agent registry, and no internal/forbidden content
        # leaks into the skill. See scripts/check-skill.mjs for the rule set.
        run: node scripts/check-skill.mjs

  tool-docs-parity:
    name: MCP tool catalog parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify docs/api/mcp-tools.md matches the registry
        # No dependencies — pure node:fs. Parses the canonical inventory table
        # in docs/api/mcp-tools.md (delimited by <!-- tool-docs:inventory -->
        # markers) and asserts set/route/group/required/enum parity against
        # ALL_TOOLS + route-policy.ts + tool-groups.ts. Fails the PR if a tool
        # is shipped but missing from the docs, the docs claim an unregistered
        # tool is shipped, a route/group diverges from the source, a required
        # schema field or enum token is missing, or internal phase/spec
        # references leak into the user-visible surface. See
        # scripts/check-tool-docs.mjs for the rule set.
        run: node scripts/check-tool-docs.mjs

  manual-setup-parity:
    name: Manual setup snippet parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify docs/manual-setup.md snippets match the registry
        # No dependencies — pure node:fs. Parses every ```json block in
        # docs/manual-setup.md and asserts that each stdio server entry matches
        # the canonical shape the CLI agent registry (cli/src/utils/agents.ts)
        # produces for that client, that required clients (Cursor, Claude
        # Desktop, Claude Code) are each represented, that every entry carries
        # an absolute GODOT_PROJECT_PATH, that no entry carries a url/headers/
        # token/HTTP type key, that the version pin matches version.json, and
        # that no internal phase/spec references or forbidden reference-project
        # names leak into the guide. See scripts/check-manual-setup.mjs.
        run: node scripts/check-manual-setup.mjs

  # ---------------------------------------------------------------------------
  # P9.4 — Demo integration fixture.
  #
  # demo-build: deterministic — materialize the addon from packages/bridge +
  # packages/verify into demo/addons/godot_open_mcp via the CLI installer
  # (single canonical path, no stale vendored copy), assert the materialized
  # tree shape + idempotent re-run + broken-fixture patterns, then restore
  # the demo's .NET deps to prove the .csproj + Godot.NET.Sdk pin resolve
  # cleanly against NuGet. No Godot editor required — this is the
  # milliseconds-fast deterministic gate.
  #
  # The full C# *compile* of the combined assembly (demo scripts + materialized
  # bridge + verify source) happens INSIDE the Godot editor via its bundled
  # GodotSharp / GodotSharpEditor. A raw `dotnet build` against NuGet
  # GodotSharp 4.3.0 fails because the bridge C# uses APIs the published C#
  # bindings do not expose (`EditorFileSystem.IsReady`, etc.) — the editor's
  # in-tree bindings are the authoritative compile host. That compile is
  # therefore a manual verification checklist item (demo/README.md), not a CI
  # gate. See specs/execution/P9/P9.4.md for the recorded gap.
  #
  # demo-smoke: bounded OFFLINE MCP smoke — spawns the built mcp-server over
  # stdio against the demo project and drives the MCP wire flow for the
  # always-offline tools (capabilities, ping → bridge_offline, manage_tools,
  # read_compile_errors) plus the live-first offline fallbacks (scene_get_data
  # res://Main.tscn, filesystem_list res://Fixtures). No Godot editor, no
  # bridge — the live-bridge path is documented as a manual checklist item in
  # demo/README.md (headless CI cannot reliably bind the bridge listener).
  # ---------------------------------------------------------------------------

  demo-build:
    name: Demo project materialize + fixture-shape check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CLI
        # The prepare-demo-addon script wraps `cli/dist/index.js install-plugin`.
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Materialize demo addon + assert fixture shapes
        # Idempotent — wraps the CLI installer; --check also asserts the
        # materialized tree contains plugin.cfg + Editor/ + Runtime/ + Verify/,
        # that a second run is a no-op, and that each broken fixture exhibits
        # the exact pattern its live verify rule keys on.
        run: node scripts/prepare-demo-addon.mjs --check

      - name: Runtime/Editor boundary guard
        # Re-run the boundary check so a future bridge change that leaks an
        # editor API into Runtime/ is caught at the demo build too, not just
        # at the package-level gate.
        run: python scripts/check-runtime-boundary.py --verbose

      - name: Restore demo .NET deps
        # `dotnet restore` proves the Godot.NET.Sdk/4.3.0 pin + net8.0
        # target resolve cleanly against NuGet. The actual C# compile of the
        # combined assembly runs inside the Godot editor (see P9.4 recorded
        # gap above) — this step does NOT `dotnet build`, by design.
        working-directory: demo
        run: dotnet restore GodotOpenMcp.Demo.csproj

      - name: Verify clean tree (no generated files committed)
        # The materialized addon + .godot/ + bin/ + obj/ must NOT appear as
        # tracked additions. If they do, .gitignore or the prepare script is
        # broken.
        run: |
          if [ -n "$(git status --porcelain demo/addons demo/.godot demo/bin demo/obj demo/.mono demo/.godot-open-mcp)" ]; then
            echo "Unexpected generated files surfaced in the working tree:"
            git status --porcelain demo/
            exit 1
          fi

  demo-smoke:
    name: Demo offline MCP smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Build CLI
        working-directory: cli
        run: |
          npm ci
          npm run build

      - name: Build MCP server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build

      - name: Materialize demo addon
        # Smoke needs the addon tree present so the demo project looks like a
        # real consumer project. No --check here (demo-build covers that) —
        # keep this job focused on the MCP smoke.
        run: node scripts/prepare-demo-addon.mjs

      - name: Run bounded offline MCP smoke
        # Bounded — the script's own timeouts + the step timeout cap how long
        # a hung stdio child can run. Exit 0 pass, 1 fail, 2 bootstrap.
        # No .NET build needed — the offline readers parse the demo fixtures
        # straight from disk; no Godot editor and no bridge are spawned.
        timeout-minutes: 5
        run: node mcp-server/scripts/demo-smoke.mjs --project demo

      - name: Verify clean tree (no scratch left behind)
        if: always()
        run: |
          if [ -n "$(git status --porcelain demo/SmokeScratch demo/addons demo/.godot demo/.godot-open-mcp)" ]; then
            echo "Smoke left generated/scratch files behind:"
            git status --porcelain demo/
            exit 1
          fi

