# CI for Godot Open MCP.
#
# - bootstrap: required repo paths present.
# - version-sync: generated version targets match version.json.
# - runtime-boundary: fast static guard — no editor-only Godot API leaks into Runtime/.
# - skill-audit: drift + safety audit for skills/godot-open-mcp/SKILL.md and
#   skills/client-paths.json (line budget, tool references, manifest cross-field
#   rules, forbidden content).
# - tool-docs-parity: drift audit for docs/api/mcp-tools.md against ALL_TOOLS +
#   route-policy.ts + tool-groups.ts (set / route / group / required / enum /
#   public-surface hygiene).
# - manual-setup-parity: drift audit for docs/manual-setup.md against the CLI
#   agent registry (required Cursor/Claude snippets match the canonical
#   stdio envelope, absolute GODOT_PROJECT_PATH, no HTTP/token keys, no
#   internal/forbidden content leaks).
# - mcp-server: typecheck + unit tests for the stdio MCP server package.

name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  bootstrap:
    name: Repo bootstrap check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required paths exist
        run: |
          set -e
          for path in \
            mcp-server \
            packages/bridge \
            packages/verify \
            cli \
            skills \
            demo \
            scripts \
            docs \
            docs/api \
            version.json \
            scripts/sync-version.mjs \
            README.md \
            docs/architecture.md \
            docs/api.md \
            docs/manual-setup.md \
            AGENTS.md; do
            test -e "$path" || { echo "Missing required path: $path"; exit 1; }
          done
          echo "All required bootstrap paths present."

  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify trio targets match version.json
        run: node scripts/sync-version.mjs --check

  runtime-boundary:
    name: Runtime/Editor boundary guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify no editor-only API leaks into packages/bridge/Runtime/
        # Fast static guard (milliseconds, no .NET build). Fails the PR if any
        # Runtime/**/*.cs references EditorInterface / EditorPlugin /
        # EditorFileSystem / EditorScript in real code outside a #if TOOLS guard.
        # See scripts/check-runtime-boundary.py for the rule set and suppression path.
        run: python scripts/check-runtime-boundary.py --verbose

  mcp-server:
    name: mcp-server typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install
        working-directory: mcp-server
        run: npm ci

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Test
        working-directory: mcp-server
        run: npm test

  skill-audit:
    name: Agent skill + client-paths audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify skill + manifest pass audit
        # No dependencies — pure node:fs. Validates that every tool name
        # referenced in skills/godot-open-mcp/SKILL.md is in the registry, the
        # skill is within the 130–180 line budget, the client-paths manifest
        # matches the CLI agent registry, and no internal/forbidden content
        # leaks into the skill. See scripts/check-skill.mjs for the rule set.
        run: node scripts/check-skill.mjs

  tool-docs-parity:
    name: MCP tool catalog parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify docs/api/mcp-tools.md matches the registry
        # No dependencies — pure node:fs. Parses the canonical inventory table
        # in docs/api/mcp-tools.md (delimited by <!-- tool-docs:inventory -->
        # markers) and asserts set/route/group/required/enum parity against
        # ALL_TOOLS + route-policy.ts + tool-groups.ts. Fails the PR if a tool
        # is shipped but missing from the docs, the docs claim an unregistered
        # tool is shipped, a route/group diverges from the source, a required
        # schema field or enum token is missing, or internal phase/spec
        # references leak into the user-visible surface. See
        # scripts/check-tool-docs.mjs for the rule set.
        run: node scripts/check-tool-docs.mjs

  manual-setup-parity:
    name: Manual setup snippet parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify docs/manual-setup.md snippets match the registry
        # No dependencies — pure node:fs. Parses every ```json block in
        # docs/manual-setup.md and asserts that each stdio server entry matches
        # the canonical shape the CLI agent registry (cli/src/utils/agents.ts)
        # produces for that client, that required clients (Cursor, Claude
        # Desktop, Claude Code) are each represented, that every entry carries
        # an absolute GODOT_PROJECT_PATH, that no entry carries a url/headers/
        # token/HTTP type key, that the version pin matches version.json, and
        # that no internal phase/spec references or forbidden reference-project
        # names leak into the guide. See scripts/check-manual-setup.mjs.
        run: node scripts/check-manual-setup.mjs
