# Bootstrap CI — repo structure + version sync until mcp-server ships (Phase 1).
#
# Phase 1 will add mcp-server typecheck/test jobs here or in a dedicated workflow.

name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  bootstrap:
    name: Repo bootstrap check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required paths exist
        run: |
          set -e
          for path in \
            mcp-server \
            packages/bridge \
            packages/verify \
            cli \
            skills \
            demo \
            scripts \
            docs \
            docs/api \
            version.json \
            scripts/sync-version.mjs \
            README.md \
            docs/architecture.md \
            docs/api.md \
            AGENTS.md; do
            test -e "$path" || { echo "Missing required path: $path"; exit 1; }
          done
          echo "All required bootstrap paths present."

  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify trio targets match version.json
        run: node scripts/sync-version.mjs --check
